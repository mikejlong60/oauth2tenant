apiVersion: apps/v1
kind: Deployment
metadata:
  name: service1
  namespace: oauth2tenant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service1
  template:
    metadata:
      labels:
        app: service1
    spec:
      containers:
        - name: service1
          image: nginxinc/nginx-unprivileged:stable
          ports:
            - containerPort: 8080